name: doblarr

# Run Doblarr next to your other -arrs. It reaches Radarr/Sonarr/Plex on the host
# via host.docker.internal (same pattern as the media-tools stack).
#
#   1. cp config.docker.example.yaml config/config.yaml   # then fill in keys
#   2. docker compose up -d --build
#   3. open http://localhost:6363

services:
  doblarr:
    build: .
    image: doblarr:latest
    container_name: doblarr
    restart: unless-stopped
    ports:
      - "6363:6363"
    volumes:
      # holds config.yaml (see config.docker.example.yaml)
      - ./config:/config
      # jobs.json, generated Kometa fragment, scratch — must be writable by
      # uid 1000 (the container runs non-root): chown -R 1000:1000 data
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
