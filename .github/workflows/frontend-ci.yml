name: Frontend CI

# ESLint, the node unit tests, the UI build and the Playwright specs. The specs
# run the real server, so backend changes (doblarr/**) run this too. Like
# backend-ci.yml, release.yml gates on it, and a dev → main/master pull request
# skips it because the push already tested that commit.
on:
  pull_request:
    paths:
      - 'ui/**'
      - 'tests/frontend/**'
      - 'tests/browser_app.py'
      - 'doblarr/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - 'playwright.config.js'
      - '.github/workflows/frontend-ci.yml'
  workflow_call:

concurrency:
  group: frontend-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: lint, unit, build, browser
    if: github.event_name != 'pull_request' || github.head_ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      # The browser specs run the real server, which renders previews with FFmpeg.
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - run: pip install -e ".[dev]"
      - run: npm ci
      # Chromium is keyed on the installed Playwright version, so it downloads
      # once per upgrade instead of on every run. Its system libraries still
      # install each time (install-deps), which is quick.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npx playwright install-deps chromium
      - run: npm run check
