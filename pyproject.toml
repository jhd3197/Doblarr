[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doblarr"
dynamic = ["version"]
description = "AI dubbing for your media library"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Keep in sync with requirements.txt (the Dockerfile installs from that).
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "pysubs2>=1.6",
    "tenacity>=8",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",   # TestClient transport
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
doblarr = "doblarr.cli:main"

[tool.setuptools]
packages = ["doblarr", "doblarr.clients", "doblarr.stages"]

[tool.setuptools.dynamic]
version = { attr = "doblarr.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["doblarr"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
