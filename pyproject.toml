[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doblarr"
dynamic = ["version"]
description = "AI dubbing for your media library"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Keep in sync with requirements.txt (the Dockerfile installs from that).
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "pysubs2>=1.6",
    "tenacity>=8",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2",
    "prompture[anthropic]>=1.13.6",  # structured AI translation; 1.13.6 adds the AniList reader
    "scikit-learn>=1.3",             # groups an episode's lines into voices (doblarr/speakers.py)
]

[project.optional-dependencies]
# Real (non-dry-run) pipeline: pip install doblarr[real]
# Install a torch build matching your platform/CUDA first (https://pytorch.org) —
# whisperx/pyannote pull in torch, but you want the right wheel for your GPU.
real = [
    "demucs>=4.0",          # music/vocal source separation
    "whisperx",             # transcription + word-level alignment
    "pyannote.audio>=3.1",  # voice model (ungated); full diarization needs a HuggingFace token
    "sherpa-onnx>=1.12",    # 3D-Speaker and NeMo voice models (doblarr/voice_models.py)
]
# Optional visual analysis (doblarr/vision): shots, faces, tracks, active speaker.
# OpenCV 5 dropped the cascade classifier the anime detector needs, so stay on 4.
vision = [
    "opencv-python-headless>=4.8,<6",
]
# Optional: how each line sounds (doblarr/emotion.py) with emotion2vec. The
# picture side needs only a model that sees (analysis.emotion_model).
emotion = [
    "funasr>=1.2",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.5",  # `pytest -n auto`: the suite on every core
    "httpx>=0.27",   # TestClient transport
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests>=2.31",
    "numpy<2.5",     # chunking tests; 2.5 stubs break mypy at 3.11
]

[project.scripts]
doblarr = "doblarr.cli:main"

[project.urls]
Homepage = "https://github.com/jhd3197/Doblarr"
Issues = "https://github.com/jhd3197/Doblarr/issues"

[tool.setuptools]
packages = ["doblarr", "doblarr.clients", "doblarr.knowledge", "doblarr.stages", "doblarr.routes",
            "doblarr.studio", "doblarr.vision"]

[tool.setuptools.package-data]
"doblarr" = ["data/*.json"]
"doblarr.knowledge" = ["data/*.json"]

[tool.setuptools.dynamic]
version = { attr = "doblarr.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: renders real audio end to end (tests/conftest.py SLOW_FILES); `-m \"not slow\"` skips them",
]

# Plain `pytest -q` stays fast and quiet; CI adds --cov flags explicitly
# (see .github/workflows/ci.yml).
[tool.coverage.run]
source = ["doblarr"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["doblarr"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# librosa ships Python 3.12 syntax (`type` statements) that a 3.11 check can't
# parse; Doblarr only calls it, so its sources are not followed.
[[tool.mypy.overrides]]
module = ["librosa", "librosa.*"]
follow_imports = "skip"
